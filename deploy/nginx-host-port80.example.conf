# 宿主机 Nginx 监听 80、再转本机 5173/8080 时，必须带上客户端 IP，否则审计日志会是 127.0.0.1
# 用法：合并进 C:\nginx\conf\nginx.conf 或 /etc/nginx/conf.d/ 后 reload

server {
    listen 80;
    server_name _;

    # 方案 A：前端 Docker/Vite 在 5173，由容器内 Nginx 再转 /api
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 方案 B：静态文件在宿主机，API 直连 Spring Boot 8080（二选一，勿与方案 A 的 / 冲突）
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
