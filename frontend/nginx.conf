server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gcsc_backend:8080/api/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://gcsc_backend:8080/uploads/;
        proxy_set_header Host $host;
    }
}